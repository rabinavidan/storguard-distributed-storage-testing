[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storguard"
version = "0.1.0"
description = "Python reliability, chaos and performance-testing platform for distributed storage systems"
requires-python = ">=3.9"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.27",
    "paramiko>=3.4",
    "click>=8.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "docker>=7.1",
    "rich>=13.7",          # pretty CLI output
    "tenacity>=9.0",       # retry with backoff
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "allure-pytest>=2.13",
    "pytest-cov>=5.0",
]
dev = [
    "storguard[test]",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
    "boto3-stubs[s3]>=1.35",
    "types-pyyaml>=6.0",
    "types-paramiko>=3.4",
]

# Install Ollama models separately:
#   ollama pull llama3.2       (2 GB  — recommended)
#   ollama pull llama3.2:1b   (1.3 GB — lightweight)
#   ollama pull mistral        (4 GB  — best JSON output)

[project.scripts]
storguard = "storguard.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["storguard*"]

# ─── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# ─── Black ────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py39"]

# ─── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]
