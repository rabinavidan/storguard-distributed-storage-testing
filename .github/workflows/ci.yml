name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Nightly full run (resilience, security, race, snapshot, replication, performance) — 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Also run resilience/security/race/snapshot/replication/performance"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MINIO_ROOT_USER: storguard
  MINIO_ROOT_PASSWORD: storguard_secret_123

jobs:
  # ─── Fast gate: lint/format/types (informational) + unit tests (blocking) ────
  quality:
    name: Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install storguard
        run: pip install -e ".[dev]"

      # These report status but don't block the pipeline yet — the codebase
      # carries pre-existing ruff/black/mypy debt (never enforced before this
      # workflow existed). Flip continue-on-error off once that debt is paid
      # down; see MILESTONES.md.
      - name: Ruff (informational)
        continue-on-error: true
        run: ruff check storguard/ tests/

      - name: Black --check (informational)
        continue-on-error: true
        run: black --check storguard/ tests/

      - name: mypy (informational)
        continue-on-error: true
        run: mypy storguard/

      - name: Unit tests
        run: |
          mkdir -p test-results
          python -m pytest tests/unit/ --junit-xml=test-results/unit.xml -v --tb=short

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/
          retention-days: 14

  # ─── Live 4-node MinIO cluster suite ──────────────────────────────────────────
  cluster-tests:
    name: Live Cluster Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install storguard
        run: pip install -e ".[dev]"

      - name: Copy env template
        run: cp .env.example .env

      - name: Start MinIO cluster
        working-directory: infrastructure
        run: docker compose --profile storage up -d

      - name: Wait for cluster health
        working-directory: infrastructure
        env:
          DEADLINE_SECONDS: "120"
        run: bash scripts/wait-for-health.sh

      - name: Smoke tests
        run: |
          mkdir -p test-results
          python -m pytest tests/ -m smoke \
            --alluredir=allure-results --junit-xml=test-results/smoke.xml \
            --timeout=300 -v --tb=short

      - name: Functional tests
        run: |
          python -m pytest tests/ -m "functional or integrity" \
            --alluredir=allure-results --junit-xml=test-results/functional.xml \
            --timeout=120 -v --tb=short

      # Resilience, security, race conditions, snapshots, replication and
      # performance are slower and touch chaos (node stop/restart, tc netem,
      # disk pressure) — run them nightly or on manual request rather than on
      # every push/PR, per the plan's "PR/nightly" test-layer strategy.
      - name: Extended suite (resilience, security, race, snapshot, replication, performance)
        if: github.event_name == 'schedule' || inputs.full_suite == true
        run: |
          python -m pytest tests/ \
            -m "resilience or security or race or snapshot or replication or performance" \
            --alluredir=allure-results --junit-xml=test-results/extended.xml \
            --timeout=300 -v --tb=short

      - name: Container logs on failure
        if: failure()
        working-directory: infrastructure
        run: docker compose --profile storage logs --tail=200

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-test-results
          path: |
            allure-results/
            test-results/
          retention-days: 14

      - name: Tear down cluster
        if: always()
        working-directory: infrastructure
        run: docker compose --profile storage down -v
