[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ─── Custom markers ───────────────────────────────────────────────────────────
markers =
    smoke:       fast blocking health checks (<5 min total)
    functional:  S3 CRUD, metadata, naming and replacement
    integration: Python client → S3 protocol → storage nodes
    integrity:   SHA-256 and size validation after transfer and recovery
    resilience:  node loss, restart, latency, packet loss and disk pressure
    snapshot:    point-in-time create/list/restore/delete via server-side S3 copy
    performance: parallel throughput and latency percentiles
    security:    invalid credentials, permissions and TLS
    negative:    missing objects, invalid input and unavailable services
    ai:          Ollama integration tests (skipped when Ollama not running)
    unit:        pure unit tests with no external dependencies
    component:   single-module tests with mocked collaborators
    boundary:    edge-case and boundary-value tests

# ─── Defaults ─────────────────────────────────────────────────────────────────
addopts =
    --strict-markers
    --tb=short
    -q

# ─── Timeouts ─────────────────────────────────────────────────────────────────
timeout = 120
timeout_method = thread

# ─── Allure ───────────────────────────────────────────────────────────────────
# Pass --alluredir=allure-results on the command line to enable Allure output.
