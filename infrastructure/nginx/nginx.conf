worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Round-robin across all 4 MinIO nodes
    upstream minio_api {
        least_conn;
        server minio1:9000;
        server minio2:9000;
        server minio3:9000;
        server minio4:9000;
    }

    # MinIO console served from node 1 only
    upstream minio_console {
        server minio1:9001;
    }

    # ─── S3 API gateway (port 9000) ──────────────────────────────────────────
    server {
        listen 9000;
        server_name _;

        # Required for S3 chunked uploads
        ignore_invalid_headers off;

        # No size limit — chaos tests upload 100 MB+ objects
        client_max_body_size 0;

        location / {
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout  300;
            proxy_send_timeout     300;
            proxy_read_timeout     300;

            # HTTP/1.1 keepalive to backend
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            # Disable buffering so streaming uploads/downloads work correctly
            proxy_buffering    off;
            proxy_request_buffering off;

            proxy_pass http://minio_api;
        }
    }

    # ─── MinIO console (port 9090) ────────────────────────────────────────────
    server {
        listen 9090;
        server_name _;

        ignore_invalid_headers off;
        client_max_body_size 0;

        location / {
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket support (console uses WS for live updates)
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            proxy_pass http://minio_console;
        }
    }
}
